services:
  postgres:
    image: postgres:latest
    container_name: jiffycrm-postgres
    environment:
      POSTGRES_USER: jiffy
      POSTGRES_PASSWORD: jiffy
      POSTGRES_DB: jiffycrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - jiffy
    restart: unless-stopped

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
    image: jiffycrm/ui:latest
    container_name: jiffycrm-ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://jiffy:jiffy@postgres:5432/jiffycrm
      - IDENTITY_LINK_ADDR=identity-link:50051
      - AUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - "AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET to at least 32 random bytes}"
      - "AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}"
      - "AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}"
      - "AUTH_MICROSOFT_ENTRA_ID_ID=${AUTH_MICROSOFT_ENTRA_ID_ID:-}"
      - "AUTH_MICROSOFT_ENTRA_ID_SECRET=${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}"
      - "AUTH_MICROSOFT_ENTRA_ID_ISSUER=${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-https://login.microsoftonline.com/organizations/v2.0}"
      - "ALLOWED_MICROSOFT_TENANT_IDS=${ALLOWED_MICROSOFT_TENANT_IDS:-}"
    depends_on:
      postgres:
        condition: service_started
      identity-link:
        condition: service_started
    networks:
      - jiffy
    restart: unless-stopped

  identity-postgres:
    image: postgres:16-alpine
    container_name: jiffycrm-identity-postgres
    environment:
      POSTGRES_USER: identity_link
      POSTGRES_PASSWORD: identity_link
      POSTGRES_DB: identity_link
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_link -d identity_link"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jiffy
    restart: unless-stopped

  identity-link-migrate:
    build:
      context: ../identity-link
      dockerfile: Dockerfile
    image: jiffycrm/identity-link:latest
    container_name: jiffycrm-identity-link-migrate
    entrypoint: ["/usr/local/bin/identity-link-migrate", "up"]
    environment:
      - DATABASE_URL=postgres://identity_link:identity_link@identity-postgres:5432/identity_link?sslmode=disable
    depends_on:
      identity-postgres:
        condition: service_healthy
    networks:
      - jiffy
    restart: "no"

  identity-link:
    build:
      context: ../identity-link
      dockerfile: Dockerfile
    image: jiffycrm/identity-link:latest
    container_name: jiffycrm-identity-link
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      - DATABASE_URL=postgres://identity_link:identity_link@identity-postgres:5432/identity_link?sslmode=disable
      - "EMAIL_HMAC_SECRET=${IDENTITY_LINK_HMAC_SECRET:?Set IDENTITY_LINK_HMAC_SECRET to at least 32 random bytes}"
      - LOG_LEVEL=info
    depends_on:
      identity-postgres:
        condition: service_healthy
      identity-link-migrate:
        condition: service_completed_successfully
    networks:
      - jiffy
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: jiffycrm-adminer
    profiles:
      - tools
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=identity-postgres
    depends_on:
      - identity-postgres
    networks:
      - jiffy
    restart: unless-stopped

