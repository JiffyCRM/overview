services:
  postgres:
    image: postgres:16-alpine
    container_name: jiffycrm-postgres
    environment:
      POSTGRES_USER: jiffy
      POSTGRES_PASSWORD: jiffy
      POSTGRES_DB: jiffycrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jiffy
    restart: unless-stopped

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
    image: jiffycrm/ui:latest
    container_name: jiffycrm-ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://jiffy:jiffy@postgres:5432/jiffycrm
    depends_on:
      - postgres
    networks:
      - jiffy
    restart: unless-stopped

