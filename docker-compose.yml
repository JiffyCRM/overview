services:
  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
    image: jiffycrm/ui:latest
    container_name: jiffycrm-ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

